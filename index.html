<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="ninomaeDev が公開しているアプリのサポート窓口です。各アプリのサポートページ・プライバシーポリシー・お問い合わせ先をまとめています。">
<title>アプリサポート | ninomaeDev</title>
<style>
  :root {
    --accent: #0066cc;
    --ink: #1d1d1f;
    --ink-2: #4b4b50;
    --ink-3: #6e6e73;
    --bg: #f5f5f7;
    --card: #ffffff;
    --line: #e3e3e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.8;
    max-width: 720px; margin: 0 auto; padding: 48px 16px 64px;
  }
  header { margin-bottom: 40px; }
  h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -.01em; }
  .tagline { color: var(--ink-3); margin-top: 6px; font-size: 0.95rem; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 40px 0 12px; }
  .app {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 22px; text-decoration: none; color: inherit;
    margin-bottom: 12px;
  }
  .app:hover { border-color: var(--accent); }
  .app span { display: block; }
  .app .name { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
  .app .desc { color: var(--ink-2); font-size: 0.92rem; margin-top: 2px; }
  .app .platform { color: var(--ink-3); font-size: 0.82rem; margin-top: 8px; }
  .note { color: var(--ink-3); font-size: 0.9rem; }
  .links a { color: var(--accent); }
  footer {
    margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line);
    font-size: 0.85rem; color: var(--ink-3);
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>アプリサポート</h1>
  <p class="tagline">ninomaeDev が公開しているアプリの、サポート窓口と規約を置いています。</p>
</header>

<h2>公開中のアプリ</h2>

<a class="app" href="./questodo/">
  <span class="name">QuesToDo</span>
  <span class="desc">タスクをこなして冒険者を育てる、RPG風ToDoアプリ</span>
  <span class="platform">iPhone / 日本語・英語 — サポートとプライバシーポリシー</span>
</a>

<h2>お問い合わせ</h2>
<p class="note">
  アプリごとの窓口は各サポートページに記載しています。全般のお問い合わせは
  <a href="mailto:ninomae.contact@gmail.com">ninomae.contact@gmail.com</a> まで。
</p>

<footer>
  制作物の紹介や記事は
  <a href="https://ninomae-renichi.com/">ninomae-renichi.com</a>
  にまとめています。
</footer>

</body>
</html>
